services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: albergo
      POSTGRES_PASSWORD: albergo
      POSTGRES_DB: albergo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albergo -d albergo"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://albergo:albergo@postgres:5432/albergo?sslmode=disable
      STAFF_API_KEY: dev-staff-key
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/worker"]
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://albergo:albergo@postgres:5432/albergo?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
